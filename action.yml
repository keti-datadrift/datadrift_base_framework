name: "ddoc drift gate"
description: >-
  Fail the job when data drifted between two paths. Runs `ddoc diff`,
  whose exit code carries the verdict: 0 = OK, 1 = DRIFT, 2 = BLIND
  (cannot determine). Point it at bare CSV files/folders or prepared
  ddoc layouts — modality is sniffed automatically.
branding:
  icon: "activity"
  color: "red"

inputs:
  ref:
    description: "Baseline dataset (directory or file)"
    required: true
  cur:
    description: "Current dataset (directory or file)"
    required: true
  threshold:
    description: "Overall-score threshold for the DRIFT verdict"
    required: false
    default: "0.15"
  attr-threshold:
    description: "Single-attribute threshold (a strong local shift triggers DRIFT even when the average looks calm)"
    required: false
    default: "0.25"
  report:
    description: "Optional path — write a self-contained HTML consultation note (upload it as an artifact to keep the evidence)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install ddoc
      shell: bash
      run: python -m pip install -q "${{ github.action_path }}/drift_studio/ddoc"
    - name: ddoc diff
      shell: bash
      run: |
        args=(diff "${{ inputs.ref }}" "${{ inputs.cur }}"
              --threshold "${{ inputs.threshold }}"
              --attr-threshold "${{ inputs['attr-threshold'] }}")
        if [ -n "${{ inputs.report }}" ]; then
          args+=(--report "${{ inputs.report }}")
        fi
        ddoc "${args[@]}"
