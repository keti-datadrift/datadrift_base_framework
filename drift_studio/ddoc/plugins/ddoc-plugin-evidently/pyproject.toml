[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddoc-plugin-evidently"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "Evidently-backed drift detector plugin for ddoc (R32)"
requires-python = ">=3.9"
dependencies = [
    "pluggy>=1.5.0",
    "evidently>=0.7",
    "pandas>=1.3",
]

[project.entry-points."ddoc"]
ddoc_evidently = "ddoc_plugin_evidently.plugin:EvidentlyDriftPlugin"

[tool.setuptools]
packages = {find = {where = ["."], include = ["ddoc_plugin_evidently*"]}}
include-package-data = true
zip-safe = false
