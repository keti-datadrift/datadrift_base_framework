[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddoc"
version = "2.1.0"
description = "ddoc — the data doctor for drift detection (CLI · REST · GUI)"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
#release_date = "2025-10-20"
#ddoc_hub_url = "http://127.0.0.1:8000"
#reserved = ""

authors = [
  { name = "JPark", email = "feynmanc@naver.com" }
]

# Core dependencies — kept light intentionally so `pip install ddoc` works
# for the orchestrator workflow without pulling torch, etc.
# Heavier deps live in optional-dependencies extras (see below).
#
# What `pip install ddoc` (no extras) gives you:
#   - diff — one-line drift verdict with a built-in CSV fallback
#   - analyze drift / eda (--json) — orchestrator-friendly subprocess
#     interface; the actual analysis still requires a domain plugin
#     (e.g. ddoc-plugin-vision) installed separately
#   - report / export / fetch / recipe / serve, plugin list / info
#
# What it does NOT give you (deliberate):
#   - vision plugin deps               → install [vision]
dependencies = [
  "fastapi",
  "uvicorn",
  "pandas",
  "numpy",
  "scikit-learn",
  "pyyaml",
  "weasyprint",
  "pluggy>=1.5.0",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "dotenv",
]

[project.optional-dependencies]
# Alias for backend orchestrator deployments. Currently no
# additional deps beyond core; defined so deployment manifests can pin
# `pip install ddoc[orchestrator]==2.x.y` and survive future tightening.
orchestrator = []

# Test extras — used by CI. Kept tiny so the
# core install path is uncontaminated.
test = [
  "pytest>=7.0",
]

vision = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "clip @ git+https://github.com/openai/CLIP.git",
  "pillow>=9.0.0",
  "matplotlib>=3.5.0",
  "seaborn>=0.11.0",
  "scikit-image>=0.19.0",
  "scipy>=1.7.0",
  "yellowbrick>=1.5",
]
# 2026-05-08 — ``all`` rebuilt from the named extras instead
# of duplicating their content. The previous incarnation also bundled
# three plugin packages via ``file://`` paths bound to a
# specific developer's local checkout — those would silently fail to
# resolve on any other machine and on PyPI installs. Plugins are now
# expected to be installed separately (PyPI when published, or
# ``pip install -e plugins/<name>`` in this monorepo).
all = [
  "ddoc[vision]",
]

[project.scripts]
ddoc = "ddoc.cli.main:app"

[tool.pytest.ini_options]
# Plugins/examples are separate installable packages, each with its own
# tests/test_plugin.py — prepend-mode collection (the default) registers
# bare "test_plugin" in sys.modules and collides across them the moment
# pytest is invoked from the repo root instead of per-package. importlib
# mode keys modules by file path instead, so no top-level rootdir
# __init__.py convention is required anywhere in the tree.
addopts = "--import-mode=importlib"

[tool.setuptools]
packages = {find = {where = ["."], include = ["ddoc*"]}}
include-package-data = true  # ✅ 이 줄을 여기에 두세요 (boolean 값)

[tool.setuptools.package-data]
ddoc = [
  "fonts/NanumGothicCoding-Bold.ttf",
  "fonts/NanumGothicCoding-Regular.ttf",
  "config/config.json",
  "templates/*.html",
  "server/static/*.html",
  "server/static/*.js",
  "server/static/*.css",
]